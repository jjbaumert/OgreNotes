# OgreNotes on a single home server, with DynamoDB + S3 in AWS.
# See README.md in this directory — run setup.sh once before `up`.
#
#   docker compose --env-file .env up -d --build
#
# Everything restarts on its own after a crash or reboot
# (`restart: unless-stopped`). Only Caddy publishes ports.

name: ogrenotes

x-app: &app
  build:
    context: ../..
    args:
      # The Dockerfile's default; explicit so a future default change can't
      # quietly compile the dev-login endpoint back in.
      CARGO_FEATURES: "xlsx,docx,pdf"
    # The repo's git metadata, so the build stamps the commit into the
    # sidebar version line (`v0.2.0 <commit>`); `.dockerignore` keeps
    # `.git/` out of the main context.
    additional_contexts:
      gitmeta: ../../.git
  image: ogrenotes:selfhost
  env_file: ogrenotes.env
  environment:
    REDIS_URL: redis://redis:6379
    DEV_MODE: "false"
    # OGRENOTES_PORT (in .env) adds ":<port>"; browsers send it in Origin.
    FRONTEND_ORIGIN: https://${OGRENOTES_DOMAIN}${OGRENOTES_PORT:+:${OGRENOTES_PORT}}
    OAUTH_REDIRECT_URI: https://${OGRENOTES_DOMAIN}${OGRENOTES_PORT:+:${OGRENOTES_PORT}}/api/v1/auth/callback
    SEARCH_INDEX_PATH: /data/search-index
    # Keys set in ogrenotes.env win; left out, the SDK falls back to the one
    # profile aws-creds.sh copied here (none unless OGRENOTES_AWS_PROFILE).
    AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
  volumes:
    - ./aws/app:/aws:ro
  restart: unless-stopped
  depends_on:
    - redis

services:
  api:
    <<: *app
    volumes:
      - ./aws/app:/aws:ro
      - search-index:/data/search-index

  worker:
    <<: *app
    command: ["ogrenotes-api", "--mode=worker"]

  redis:
    image: redis:7-alpine
    # Append-only file so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  caddy:
    build: ./caddy
    image: ogrenotes-caddy:selfhost
    env_file: caddy.env
    environment:
      OGRENOTES_DOMAIN: ${OGRENOTES_DOMAIN}
      # Same fallback as the app: keys in caddy.env, else aws/caddy.
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    ports:
      - "80:80"
      - "${OGRENOTES_PORT:-443}:443"
      - "${OGRENOTES_PORT:-443}:443/udp"
    volumes:
      - ./aws/caddy:/aws:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  search-index:
  redis-data:
  caddy-data:
  caddy-config:
