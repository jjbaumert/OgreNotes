[package]
name = "ogrenotes-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
ogrenotes-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
serde_dynamo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Captures the HTTP requests the DynamoDB SDK actually emits, so a test can
# assert on request *shape* — specifically that the REPORT read sets
# ConsistentRead. DynamoDB Local can't express that difference (it serves
# every read from one store), so this is the only way to pin it.
aws-smithy-runtime = { version = "1", features = ["test-util", "client"] }
aws-smithy-types = "1"
http = "1"

