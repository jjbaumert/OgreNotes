name: Claude Code

# ─── DISABLED ──────────────────────────────────────────────────────────
# This workflow calls anthropics/claude-code-action, which consumes the
# repo's ANTHROPIC_API_KEY secret (billed usage) whenever someone writes
# `@claude` in a comment/issue/review. It has been disabled to stop that
# key consumption:
#   1. the automatic event triggers below are removed (only manual
#      `workflow_dispatch` remains), AND
#   2. the job is hard-gated with `if: false`, so even a manual dispatch
#      is a no-op and the key-using step never runs.
# To RE-ENABLE: restore the event triggers and the original `if:` guard
# (preserved in the comment on the job below), and remove `if: false`.
#
# Original triggers (restore to re-enable):
#   on:
#     issue_comment:            { types: [created] }
#     pull_request_review_comment: { types: [created] }
#     issues:                   { types: [opened, assigned] }
#     pull_request_review:      { types: [submitted] }
on:
  workflow_dispatch:

jobs:
  claude:
    # Hard-disabled — see the DISABLED banner at the top of this file.
    # Original @claude-mention guard (restore when re-enabling):
    #   if: |
    #     (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
    #     (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
    #     (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
    #     (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Either credential works; the public repo (post 2026-07-07
          # re-publish) has ANTHROPIC_API_KEY set. Keep both inputs so
          # whichever secret exists is picked up.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

