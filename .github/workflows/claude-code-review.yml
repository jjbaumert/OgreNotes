name: Claude Code Review

# ─── DISABLED ──────────────────────────────────────────────────────────
# This workflow calls anthropics/claude-code-action, which consumes the
# repo's ANTHROPIC_API_KEY secret (billed usage) on every pull request.
# It has been disabled to stop that automatic key consumption:
#   1. the automatic `pull_request` trigger below is removed (only manual
#      `workflow_dispatch` remains, so it never fires on its own), AND
#   2. the job is hard-gated with `if: false`, so even a manual dispatch
#      is a no-op and the key-using step never runs.
# To RE-ENABLE: restore the `pull_request` trigger and delete the
# `if: false` guard on the job.
#
# Original trigger (restore to re-enable):
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened]
on:
  workflow_dispatch:

jobs:
  claude-review:
    # Hard-disabled — see the DISABLED banner at the top of this file.
    # Delete this line to re-enable (and restore the pull_request trigger).
    if: false

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticate with the API key — the only credential this repo
          # has set (`gh secret list` shows ANTHROPIC_API_KEY only).
          #
          # Do NOT also pass claude_code_oauth_token: the CLAUDE_CODE_OAUTH_TOKEN
          # secret is unset, so `${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` resolves
          # to an empty string. Passing an empty OAuth token makes Claude Code
          # attempt subscription (OAuth) auth with an empty bearer and reject the
          # very first turn — is_error:true at ~200ms and $0 cost — even though
          # ANTHROPIC_API_KEY is valid (that was the failure on every PR before
          # this change). If you switch to a Claude subscription, add the
          # CLAUDE_CODE_OAUTH_TOKEN secret and pass it here *instead of*
          # anthropic_api_key, not alongside it.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

